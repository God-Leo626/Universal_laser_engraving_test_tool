<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1440" viewBox="0 0 1440 1440" role="img" aria-labelledby="title desc">
<title id="title">NRF52832 蓝牙广播接收程序流程图</title><desc id="desc">左侧为配置和运行阶段的主循环，右侧为 BLE 与 UART 异步事件。有效命令更新配置；运行时按 RSSI 和可选特征筛选，解码并串口输出。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="1440" height="1440" fill="white"/>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#16324f;font-size:18px} .heading{font-size:22px;font-weight:bold}</style>
<text x="720" y="48.5" text-anchor="middle" style="font-size:30px;font-weight:bold">
<tspan x="720" y="48.5">NRF52832 蓝牙广播接收程序 · 总流程</tspan>
</text>
<text x="720" y="89" text-anchor="middle">
<tspan x="720" y="89">先配置，再持续过滤与输出；BLE 和 UART 事件与主循环并行。</tspan>
</text>
<text x="160" y="170" text-anchor="middle" class="heading">
<tspan x="160" y="170">主循环</tspan>
</text>
<text x="1199" y="168" text-anchor="middle" class="heading">
<tspan x="1199" y="168">BLE 异步事件</tspan>
</text>
<text x="1199" y="740" text-anchor="middle" class="heading">
<tspan x="1199" y="740">UART 异步事件</tspan>
</text>
<polyline points="460,168 460,205" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="460,297 460,352" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="330,411 240,411 240,524" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="590,411 705,411 705,524" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="240,600 240,656" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="240,744 240,794" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="240,918 240,968" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="70,856 49,856 49,1189 495,1189 495,1220" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="240,1056 240,1189 495,1189 495,1220" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="705,600 705,654" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="705,786 705,832" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="905,720 943,720 943,1189 495,1189 495,1220" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="705,896 705,942" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="705,1038 705,1084" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="705,1164 705,1189 495,1189 495,1220" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="495,1298 495,1340 26,1340 26,322 460,322 460,352" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1199,285 1199,332" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1199,448 1199,490" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1395,390 1420,390 1420,633 1395,633" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1199,848 1199,885" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1199,969 1199,1005" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="330" y="112" width="260" height="56" rx="8" fill="#dbeafe" stroke="#64748b"/>
<text x="460" y="146" text-anchor="middle">
<tspan x="460" y="146">上电 / 复位</tspan>
</text>
<rect x="170" y="205" width="580" height="92" rx="8" fill="#dbeafe" stroke="#64748b"/>
<text x="460" y="232" text-anchor="middle">
<tspan x="460" y="232">初始化 SoftDevice → 启动被动扫描</tspan>
<tspan x="460" y="257">初始化串口 / TIMER1 / PPI / LED</tspan>
<tspan x="460" y="282">输出启动信息</tspan>
</text>
<polygon points="460,352 590,411 460,470 330,411" fill="#fef3c7" stroke="#64748b"/>
<text x="460" y="417" text-anchor="middle">
<tspan x="460" y="417">已收到开始命令？</tspan>
</text>
<rect x="70" y="524" width="340" height="76" rx="8" fill="#e0f2fe" stroke="#64748b"/>
<text x="240" y="555.5" text-anchor="middle">
<tspan x="240" y="555.5">配置阶段</tspan>
<tspan x="240" y="580.5">丢弃已入队广播</tspan>
</text>
<rect x="525" y="524" width="360" height="76" rx="8" fill="#dcfce7" stroke="#64748b"/>
<text x="705" y="555.5" text-anchor="middle">
<tspan x="705" y="555.5">运行阶段</tspan>
<tspan x="705" y="580.5">取一条广播报告</tspan>
</text>
<rect x="70" y="656" width="340" height="88" rx="8" fill="#e0f2fe" stroke="#64748b"/>
<text x="240" y="681" text-anchor="middle">
<tspan x="240" y="681">读取串口数据</tspan>
<tspan x="240" y="706">先复制，再重启接收</tspan>
<tspan x="240" y="731">按 CRLF 拼接命令行</tspan>
</text>
<polygon points="240,794 410,856 240,918 70,856" fill="#fef3c7" stroke="#64748b"/>
<text x="240" y="849.5" text-anchor="middle">
<tspan x="240" y="849.5">命令完整且</tspan>
<tspan x="240" y="874.5">参数有效？</tspan>
</text>
<rect x="70" y="968" width="340" height="88" rx="8" fill="#e0f2fe" stroke="#64748b"/>
<text x="240" y="993" text-anchor="middle">
<tspan x="240" y="993">保存配置并应答</tspan>
<tspan x="240" y="1018">开始命令会锁定配置</tspan>
<tspan x="240" y="1043">再次配置需复位</tspan>
</text>
<polygon points="705,654 905,720 705,786 505,720" fill="#fef3c7" stroke="#64748b"/>
<text x="705" y="701" text-anchor="middle">
<tspan x="705" y="701">有报告且 RSSI 达标？</tspan>
<tspan x="705" y="726">自定义模式还需</tspan>
<tspan x="705" y="751">特征前缀匹配</tspan>
</text>
<rect x="525" y="832" width="360" height="64" rx="8" fill="#dcfce7" stroke="#64748b"/>
<text x="705" y="870" text-anchor="middle">
<tspan x="705" y="870">按设置输出原始地址和 DATA</tspan>
</text>
<rect x="525" y="942" width="360" height="96" rx="8" fill="#dcfce7" stroke="#64748b"/>
<text x="705" y="971" text-anchor="middle">
<tspan x="705" y="971">XOR：校验 → 解码 MAC / SN</tspan>
<tspan x="705" y="996">明文：提取 16 字节唯一码</tspan>
<tspan x="705" y="1021">和 7 字节 SN</tspan>
</text>
<rect x="525" y="1084" width="360" height="80" rx="8" fill="#dcfce7" stroke="#64748b"/>
<text x="705" y="1117.5" text-anchor="middle">
<tspan x="705" y="1117.5">输出有效解码字段</tspan>
<tspan x="705" y="1142.5">无法解码也结束当前行</tspan>
</text>
<rect x="170" y="1220" width="650" height="78" rx="8" fill="#dbeafe" stroke="#64748b"/>
<text x="495" y="1252.5" text-anchor="middle">
<tspan x="495" y="1252.5">维护接收后更新 LED 心跳，进入下一次循环</tspan>
<tspan x="495" y="1277.5">运行阶段仅丢弃串口数据，不接受新配置</tspan>
</text>
<rect x="1003" y="205" width="392" height="80" rx="8" fill="#ede9fe" stroke="#64748b"/>
<text x="1199" y="238.5" text-anchor="middle">
<tspan x="1199" y="238.5">BLE 回调收到广播</tspan>
<tspan x="1199" y="263.5">先检查指针和长度（≤31 字节）</tspan>
</text>
<polygon points="1199,332 1395,390 1199,448 1003,390" fill="#fef3c7" stroke="#64748b"/>
<text x="1199" y="383.5" text-anchor="middle">
<tspan x="1199" y="383.5">报告合法且</tspan>
<tspan x="1199" y="408.5">队列未满？</tspan>
</text>
<rect x="1020" y="490" width="360" height="72" rx="8" fill="#ede9fe" stroke="#64748b"/>
<text x="1200" y="519.5" text-anchor="middle">
<tspan x="1200" y="519.5">复制报告后发布写索引</tspan>
<tspan x="1200" y="544.5">等待主循环取走</tspan>
</text>
<rect x="1003" y="595" width="392" height="76" rx="8" fill="#f1f5f9" stroke="#64748b"/>
<text x="1199" y="626.5" text-anchor="middle">
<tspan x="1199" y="626.5">不满足：丢弃新报告</tspan>
<tspan x="1199" y="651.5">队列容量 127 条，不覆盖旧报告</tspan>
</text>
<rect x="1003" y="778" width="392" height="70" rx="8" fill="#ede9fe" stroke="#64748b"/>
<text x="1199" y="806.5" text-anchor="middle">
<tspan x="1199" y="806.5">串口 EasyDMA 接收</tspan>
<tspan x="1199" y="831.5">每字节触发 PPI 重置空闲计时</tspan>
</text>
<rect x="1003" y="885" width="392" height="84" rx="8" fill="#ede9fe" stroke="#64748b"/>
<text x="1199" y="908" text-anchor="middle">
<tspan x="1199" y="908">2 ms 空闲 / 收满 / 硬件错误</tspan>
<tspan x="1199" y="933">异步请求停止 RX</tspan>
<tspan x="1199" y="958">回调发布长度或错误标志</tspan>
</text>
<rect x="1003" y="1005" width="392" height="90" rx="8" fill="#ede9fe" stroke="#64748b"/>
<text x="1199" y="1031" text-anchor="middle">
<tspan x="1199" y="1031">RXTO → PPI 2 → TIMER1 CC1</tspan>
<tspan x="1199" y="1056">确认硬件已停止</tspan>
<tspan x="1199" y="1081">等待主循环复制并重启接收</tspan>
</text>
<rect x="1003" y="1138" width="392" height="86" rx="8" fill="#f1f5f9" stroke="#64748b"/>
<text x="1199" y="1162" text-anchor="middle">
<tspan x="1199" y="1162">回调不打印、不忙等</tspan>
<tspan x="1199" y="1187">TX 使用驱动自有 RAM 缓冲</tspan>
<tspan x="1199" y="1212">打印采用有限等待</tspan>
</text>
<text x="282" y="440" text-anchor="middle">
<tspan x="282" y="440">否</tspan>
</text>
<text x="652" y="440" text-anchor="middle">
<tspan x="652" y="440">是</tspan>
</text>
<text x="261" y="951" text-anchor="middle">
<tspan x="261" y="951">是</tspan>
</text>
<text x="726" y="816" text-anchor="middle">
<tspan x="726" y="816">是</tspan>
</text>
<text x="925" y="753" text-anchor="middle">
<tspan x="925" y="753">否</tspan>
</text>
<text x="1220" y="478" text-anchor="middle">
<tspan x="1220" y="478">是</tspan>
</text>
<text x="1410" y="455" text-anchor="middle">
<tspan x="1410" y="455">否</tspan>
</text>
<text x="128" y="947" text-anchor="middle">
<tspan x="128" y="947">否 / 未完整</tspan>
</text>
<text x="720" y="1391" text-anchor="middle">
<tspan x="720" y="1391">自定义：RSSI + 特征前缀；默认：仅 RSSI。两种解码都要求 31 字节输入。</tspan>
</text>
</svg>
